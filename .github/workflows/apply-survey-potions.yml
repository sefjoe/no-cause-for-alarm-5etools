name: Apply Survey Crew Potion Placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-survey-potions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add survey crew potion placement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil, time

          current = "No_Cause_for_Alarm_5etools_CURRENT.json"
          snapshot = "No_Cause_for_Alarm_5etools_v3.5.json"

          with open(current, "r", encoding="utf-8") as f:
              data = json.load(f)

          old_e5 = "Lessa Dorn and Kav Orin are barricaded here. Rescuing them establishes the practical corridor Bellweather can secure after the chapter."
          new_e5 = "Lessa Dorn and Kav Orin are barricaded here. Rescuing them establishes the practical corridor Bellweather can secure after the chapter. Their survey field satchel contains 2 Potions of Healing carried as emergency medical supplies. The satchel can be recovered even if the rescue goes badly or one or more surveyors die."

          old_scene = "The survivors, Lessa Dorn and Kav Orin, are exhausted and nearly out of water. Their third member, Harl, left to seek help."
          new_scene = "The survivors, Lessa Dorn and Kav Orin, are exhausted and nearly out of water. Their third member, Harl, left to seek help. Their field satchel contains 2 Potions of Healing carried as emergency medical supplies; the party can recover it regardless of the rescue outcome."

          old_reward = "{@b Treasure and rewards.} The posted reclamation contract pays {@b 75 gp per character} on completion (300 gp for a four-character party). During the expedition, place roughly {@b 200–250 gp} of additional party value in recoverable coin, jewelry, trade goods, legitimate salvage, and private recovery bonuses. The strongbox and similar identifiable property are not free salvage: returning them earns the stated private reward. Also award 2 Potions of Healing, and one useful uncommon consumable such as Dust of Disappearance only if the party explores a sealed workshop; otherwise use mundane salvage."
          new_reward = "{@b Treasure and rewards.} The posted reclamation contract pays {@b 75 gp per character} on completion (300 gp for a four-character party). During the expedition, place roughly {@b 200–250 gp} of additional party value in recoverable coin, jewelry, trade goods, legitimate salvage, and private recovery bonuses. The strongbox and similar identifiable property are not free salvage: returning them earns the stated private reward. The survey crew's field satchel at E5 contains 2 Potions of Healing as emergency medical supplies, and the satchel remains recoverable even if the rescue goes badly. Award one useful uncommon consumable such as Dust of Disappearance only if the party explores a sealed workshop; otherwise use mundane salvage."

          counts = {"e5": 0, "scene": 0, "reward": 0}

          def walk(obj):
              if isinstance(obj, dict):
                  for k, v in list(obj.items()):
                      if isinstance(v, str):
                          if v == old_e5:
                              obj[k] = new_e5
                              counts["e5"] += 1
                          elif v == old_scene:
                              obj[k] = new_scene
                              counts["scene"] += 1
                          elif v == old_reward:
                              obj[k] = new_reward
                              counts["reward"] += 1
                      else:
                          walk(v)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      if isinstance(v, str):
                          if v == old_e5:
                              obj[i] = new_e5
                              counts["e5"] += 1
                          elif v == old_scene:
                              obj[i] = new_scene
                              counts["scene"] += 1
                          elif v == old_reward:
                              obj[i] = new_reward
                              counts["reward"] += 1
                      else:
                          walk(v)

          walk(data)

          if counts != {"e5": 1, "scene": 1, "reward": 1}:
              raise SystemExit(f"Unexpected replacement counts: {counts}")

          now = int(time.time())
          meta = data.setdefault("_meta", {})
          meta["dateLastModified"] = now
          for src in meta.get("sources", []):
              if src.get("json") == "NCFA":
                  src["dateLastModified"] = now

          with open(current, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent="\t")
              f.write("\n")

          shutil.copyfile(current, snapshot)
          PY

          python -m json.tool No_Cause_for_Alarm_5etools_CURRENT.json >/dev/null
          python -m json.tool No_Cause_for_Alarm_5etools_v3.5.json >/dev/null

      - name: Commit potion placement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-survey-potions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Place Slums healing potions with survey crew"
          git push origin HEAD:main
