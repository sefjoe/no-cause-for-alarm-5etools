name: Fix Slums Duplicate Rewards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-slums-duplicate-rewards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove duplicate generic Slums rewards section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, shutil

          path = "No_Cause_for_Alarm_5etools_CURRENT.json"
          snap = "No_Cause_for_Alarm_5etools_v3.5.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          packs = data.get("adventureData", [])
          assert packs, "No adventureData found"
          sections = packs[0].get("data", [])
          chapter = next((s for s in sections if isinstance(s, dict) and s.get("name") == "Chapter 3: The Slums"), None)
          assert chapter is not None, "Chapter 3 not found"

          def flat_text(obj):
              if isinstance(obj, str):
                  return obj
              if isinstance(obj, list):
                  return " ".join(flat_text(x) for x in obj)
              if isinstance(obj, dict):
                  return " ".join(flat_text(v) for v in obj.values())
              return ""

          generic_marker = "These rewards are party totals for the campaign's four-character baseline"
          generic_money = "150–250 gp in Council pay plus recoverable salvage"
          detailed_marker = "survey crew's field satchel at E5 contains 2 Potions of Healing"

          removed = 0

          def clean(obj):
              global removed
              if isinstance(obj, list):
                  out = []
                  for item in obj:
                      if isinstance(item, dict) and item.get("name") == "Rewards":
                          txt = flat_text(item)
                          if generic_marker in txt and generic_money in txt:
                              removed += 1
                              continue
                      clean(item)
                      out.append(item)
                  obj[:] = out
              elif isinstance(obj, dict):
                  for value in obj.values():
                      clean(value)

          clean(chapter)
          assert removed == 1, f"Expected to remove exactly one generic Slums Rewards section, removed {removed}"

          remaining_reward_texts = []
          def collect(obj):
              if isinstance(obj, dict):
                  if obj.get("name") == "Rewards":
                      remaining_reward_texts.append(flat_text(obj))
                  for value in obj.values():
                      collect(value)
              elif isinstance(obj, list):
                  for value in obj:
                      collect(value)

          collect(chapter)
          assert len(remaining_reward_texts) == 1, f"Expected one Slums Rewards section after cleanup, found {len(remaining_reward_texts)}"
          assert detailed_marker in remaining_reward_texts[0], "Detailed Slums Rewards section with potion placement is missing"

          now = int(time.time())
          meta = data.setdefault("_meta", {})
          meta["dateLastModified"] = now
          for src in meta.get("sources", []):
              if src.get("json") == "NCFA":
                  src["dateLastModified"] = now

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent="\t")
              f.write("\n")

          shutil.copyfile(path, snap)
          PY

          python -m json.tool No_Cause_for_Alarm_5etools_CURRENT.json >/dev/null
          cmp No_Cause_for_Alarm_5etools_CURRENT.json No_Cause_for_Alarm_5etools_v3.5.json

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-slums-duplicate-rewards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add No_Cause_for_Alarm_5etools_CURRENT.json No_Cause_for_Alarm_5etools_v3.5.json .github/workflows/fix-slums-duplicate-rewards.yml
          git commit -m "Remove duplicate Slums rewards section"
          git push origin HEAD:main
