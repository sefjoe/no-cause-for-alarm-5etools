name: Polish NCFA adventure format v4.11

on:
  push:
    paths:
      - '.github/workflows/polish-main-adventure-v4-11.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite editorial campaign-log language as adventure prose
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, re, time
          from pathlib import Path

          path = Path('No_Cause_for_Alarm_5etools_CURRENT.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          old_version = data['_meta']['sources'][0]['version']
          if old_version != '4.10':
              raise SystemExit(f'Expected v4.10, found {old_version}')

          name_map = {
              'Session 3 Actual Play — Locked Canon': 'Blackstone Temple Aftermath',
              'Session 3 NPC Descriptions, Motivations, and Play Cues': 'Blackstone Temple NPCs',
              'Session 3 Civic Outcome — Locked': 'Council Judgment',
              'Session 4 Lead-In — Locked': "Beginning Kellan's Well",
              'Blackstone Actual Rewards — Locked': 'Blackstone Temple Rewards',
              'Session 4 Live State — Locked': 'Chapter Opening',
              'Session 4 NPC Physical Descriptions — Locked': 'Key NPCs',
              'Session 4 NPC Physical Descriptions — Locked Canon': 'Key NPCs',
              'NPC Physical Descriptions — Locked Canon': 'Key NPCs',
              'Encounter Calibration': 'Running the Encounters',
              'Kellan’s Well Encounter Calibration': 'Running the Encounters',
              "Kellan's Well Encounter Calibration": 'Running the Encounters',
              'Table-Specific Calibration': 'Encounter Adjustments',
              'Blackstone Benchmark': 'Encounter Difficulty',
          }

          exact_text = {
              'Session 3 ran about 2.5 hours and ended as the party walked in the door of Ledger House. The later whereabouts of the seven freed captives were not established at the table and remain intentionally unresolved.':
                  'After Blackstone Temple, the party returned to Ledger House. The seven freed captives are safe, and their movements after the rescue do not affect the opening of the next chapter.',
              'Session 4 begins the next morning at Ledger House after a long rest and level-up. The party consists of four level-4 PCs.':
                  'The next chapter begins the following morning at Ledger House after a long rest and level-up. The party consists of four level-4 characters.',
              'Session 4 opens the next morning at Ledger House after a completed long rest and level-up. The party is exactly four PCs, all level 4.':
                  'The chapter opens the following morning at Ledger House after a completed long rest and level-up. The party consists of four level-4 characters.',
              'Kellan’s Well has already been accepted by everyone. Do not replay job acceptance. For Pepper it is Council business and the first, unpaid mission of her five-mission sentence.':
                  'The party has already accepted the Kellan’s Well assignment, so begin with preparations at Ledger House and the departure for the well. For Pepper, this is Council business and the first, unpaid mission of her five-mission sentence.',
              "Kellan's Well has already been accepted by everyone. Do not replay job acceptance. For Pepper it is Council business and the first, unpaid mission of her five-mission sentence.":
                  "The party has already accepted the Kellan's Well assignment, so begin with preparations at Ledger House and the departure for the well. For Pepper, this is Council business and the first, unpaid mission of her five-mission sentence.",
              'Arunem is canonically nearsighted: approximately -4 in one eye and -1 in the other. Treat this as characterization by default, not an automatic combat or Perception penalty.':
                  'Arunem is nearsighted, approximately -4 in one eye and -1 in the other. This is a roleplaying trait and does not impose an automatic combat or Perception penalty.',
              'This preservation instinct is the only separate motivation currently locked for this caretaker.':
                  'Preserving the temple records is this caretaker’s primary concern.',
              'No independent agenda beyond the immediate captive situation is currently locked; do not invent a separate plot role.':
                  'The caretaker’s role is limited to the immediate captive situation.',
              'No separate secret or independent plot agenda is locked.':
                  'The caretaker has no separate plot role in this chapter.',
              'No additional personal agenda is locked.':
                  '',
              'Do not add further appearance details or a separate agenda unless later established.':
                  '',
              'Do not elaborate his appearance beyond halfling unless later established.':
                  '',
              'Do not invent additional characterization until it is established at the table.':
                  '',
              'Do not add a new common badge or uniform unless it is established in play.':
                  'The crews do not share a common badge or uniform.',
          }

          def clean_string(s: str) -> str:
              if s in exact_text:
                  return exact_text[s]

              # Heading-style editorial language embedded in strings.
              for old, new in name_map.items():
                  if s == old:
                      return new

              s = s.replace('canonically ', '')
              s = s.replace('Current table calibration suggests', 'For this encounter, use')
              s = s.replace('current table calibration suggests', 'for this encounter, use')
              s = s.replace('Current table target:', 'Use:')
              s = s.replace('current table target:', 'use:')
              s = s.replace('published baseline roster', 'encounter roster')
              s = s.replace('Published baseline roster', 'Encounter roster')
              s = s.replace('table-specific calibration', 'encounter adjustments')
              s = s.replace('Table-specific calibration', 'Encounter adjustments')
              s = s.replace('encounter calibration', 'encounter guidance')
              s = s.replace('Encounter calibration', 'Encounter guidance')
              s = s.replace('four-character baseline', 'four-character party')

              # Turn remaining session-log wording into ordinary adventure guidance.
              s = s.replace('Session 4 begins', 'The chapter begins')
              s = s.replace('Session 4 opens', 'The chapter opens')
              s = s.replace('Session 4', 'this chapter')
              s = s.replace('Session 3', 'Blackstone Temple')
              s = s.replace('actual-play', 'adventure')
              s = s.replace('Actual-play', 'Adventure')
              s = s.replace('actual play', 'adventure outcome')
              s = s.replace('Actual Play', 'Adventure Outcome')

              # Remove editorial sentences that only document what was or was not "locked."
              sentences = re.split(r'(?<=[.!?])\s+', s)
              kept = []
              for sentence in sentences:
                  low = sentence.lower()
                  meta_detail_terms = ('agenda', 'description', 'appearance', 'characterization', 'motivation', 'plot role', 'species', 'detail', 'source', 'canon')
                  meta_markers = ('currently locked', ' is locked', ' are locked', 'not locked', 'do not invent', 'unless later established', 'at the table')
                  if any(m in low for m in meta_markers) and any(t in low for t in meta_detail_terms):
                      continue
                  if 'current source does not establish' in low or 'current source establishes' in low:
                      continue
                  if 'older generic treasure quantity conflicts' in low:
                      continue
                  if 'blackstone benchmark' in low and ('level' in low or 'fight' in low or 'party' in low):
                      continue
                  kept.append(sentence)
              s = ' '.join(x for x in kept if x).strip()

              # Clean common fragments left after removing editorial notes.
              s = s.replace('; no further physical description is locked', '')
              s = s.replace('; no further physical description is defined', '')
              s = s.replace('No name or physical description is currently locked.', '')
              s = s.replace('No name, age, or physical description is currently locked.', '')
              s = re.sub(r'\s{2,}', ' ', s).strip()
              return s

          def transform(obj):
              if isinstance(obj, dict):
                  out = {}
                  for k, v in obj.items():
                      if k == 'name' and isinstance(v, str):
                          v = name_map.get(v, v)
                      out[k] = transform(v)
                  return out
              if isinstance(obj, list):
                  vals = [transform(v) for v in obj]
                  return [v for v in vals if v != '']
              if isinstance(obj, str):
                  return clean_string(obj)
              return obj

          data = transform(data)

          # Version and metadata.
          now = int(time.time())
          data['_meta']['sources'][0]['version'] = '4.11'
          data['_meta']['sources'][0]['dateLastModified'] = now
          data['_meta']['dateLastModified'] = now
          data['_meta'].pop('_dateLastModifiedHash', None)
          stable = json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          data['_meta']['_dateLastModifiedHash'] = hashlib.sha1(stable.encode('utf-8')).hexdigest()[:10]

          text = json.dumps(data, ensure_ascii=False, indent='\t') + '\n'
          json.loads(text)
          path.write_text(text, encoding='utf-8')
          Path('No_Cause_for_Alarm_5etools_v4.11.json').write_text(text, encoding='utf-8')

          # Report remaining editorial markers for verification. Legitimate uses of "locked"
          # such as locked doors are allowed, so they are not treated as an error.
          suspicious = []
          for needle in ('Locked Canon', '— Locked', 'calibration', 'actual play', 'current source', 'do not invent'):
              if needle.lower() in text.lower():
                  suspicious.append(needle)
          print('v4.11 hash:', data['_meta']['_dateLastModifiedHash'])
          print('remaining editorial markers:', suspicious)
          PY
      - name: Commit polished adventure
        shell: bash
        run: |
          git config user.name "sefjoe"
          git config user.email "109435369+sefjoe@users.noreply.github.com"
          git rm .github/workflows/polish-main-adventure-v4-11.yml
          git add No_Cause_for_Alarm_5etools_CURRENT.json No_Cause_for_Alarm_5etools_v4.11.json
          git commit -m "Polish NCFA into regular adventure format v4.11"
          git push
