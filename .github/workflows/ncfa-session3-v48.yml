name: NCFA Session 4 Continuity Cleanup

on:
  push:
    paths:
      - '.github/workflows/ncfa-session3-v48.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale Session 3 live-state text
        shell: bash
        run: |
          python <<'PY'
          import json, time
          from pathlib import Path

          path = Path('No_Cause_for_Alarm_5etools_CURRENT.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = int(time.time())
          data['_meta']['sources'][0]['version'] = '4.8'
          data['_meta']['sources'][0]['dateLastModified'] = now
          data['_meta']['dateLastModified'] = now

          session4_entries = [
              'Session 4 opens the next morning at Ledger House after a completed long rest and level-up. The party is exactly four PCs at level 4.',
              'All four characters already accepted Kellan’s Well. Do not replay the Council consequence scene or job acceptance.',
              'Kellan’s Well is Council business, so Pepper may leave Ledger House for the mission. It is the first and unpaid mission of her five-mission sentence; the remaining four required missions are paid normally.',
              'Pepper remains on house arrest at Ledger House under Brakkus’s supervision. Outside Council business, she may leave only with Brakkus.',
              'The Council holds Tal Rusk’s coded ledger, the stolen spyglass, and the compass. The Kellan’s Well hook is independent of those objects.',
              'Arunem is canonically nearsighted (-4 in one eye, -1 in the other); treat this as roleplay by default unless the player chooses mechanical consequences.'
          ]

          # Global corrections for surviving pre-play sentence language.
          replacements = {
              'If Pepper’s sentence for Kaleb’s murder is imposed, this is Pepper’s one unpaid Council assignment; the next five required Council jobs are paid normally.':
                  'Pepper’s sentence has been imposed. Kellan’s Well is the first of five mandatory Council missions and is unpaid for Pepper; the remaining four required missions are paid normally.',
              'If Pepper is found responsible for Kaleb’s murder: one unpaid Council job, then five paid mandatory Council jobs, or jail.':
                  'Pepper was sentenced to five mandatory Council missions: the first unpaid, the next four paid normally; refusal or abandonment means jail.',
              'The ledger can provide additional color or leverage later if the party retained it, but the chapter never stalls if Tal recovered it.':
                  'The Council now holds the coded ledger. It can provide institutional context later, but Kellan’s Well does not depend on party possession of it.',
              '{@b Current lead-in.} The Council sends the party here immediately after the Blackstone resolution and Council meeting. No records box, coded ledger, or other Blackstone document is required to discover or justify the job.':
                  '{@b Current lead-in.} The party has already accepted Kellan’s Well. Session 4 begins the next morning at Ledger House after a long rest and level-up; no records box, coded ledger, or other Blackstone document is required to justify the job.'
          }

          def walk(obj):
              if isinstance(obj, dict):
                  entries = obj.get('entries')

                  # Any remaining pre-play Session 3 live checkpoint becomes the locked Session 4 checkpoint.
                  if isinstance(entries, list) and any(isinstance(x, str) and 'Session 3 opens inside Blackstone' in x for x in entries):
                      obj['name'] = 'Session 4 Live Continuity — Locked'
                      obj['entries'] = list(session4_entries)
                      entries = obj['entries']

                  # Nested Kellan lead-in from the pre-play build.
                  if obj.get('name') == 'Current Session 3 Lead-In':
                      obj['name'] = 'Session 4 Current Lead-In — Locked'
                      obj['entries'] = [
                          'Begin the session the next morning at Ledger House with four level-4 PCs after a long rest and level-up.',
                          'The party already accepted the Kellan’s Well assignment. The reason for the mission is observed coordination around the well and concern about the catacombs/waterworks route, not possession of the Iron Covenant ledger.',
                          'The Council holds the ledger, spyglass, and compass. Pepper may leave for Kellan’s Well because it is Council business.'
                      ]
                      entries = obj['entries']

                  # Patch the actual Noren command room, whose object name does not contain Noren.
                  if obj.get('name') == '5. Command Room' and isinstance(entries, list) and any(isinstance(x, str) and 'Noren Vale' in x for x in entries):
                      base = []
                      for x in entries:
                          if isinstance(x, str) and 'Noren Vale' in x:
                              base.append('{@b Noren Vale} is a pragmatic local commander. For Session 4, build him to remain relevant for roughly two meaningful rounds against this four-PC level-4 party: about 55–70 HP is a useful target unless the selected stat block is equivalently durable. He is loyal to Tyren because Tyren provides weapons, money, and protection, not because of ancestry or supernatural compulsion.')
                          else:
                              base.append(x)
                      note = '{@b Prepared escape.} If Noren decides to withdraw, use an established escape tool or route—such as a bonus-action Disengage equivalent, smoke or other obscurement, a locking passage, or allies screening his retreat. Ordinary movement through engaged PCs is not a credible escape plan for this table.'
                      if note not in base:
                          base.append(note)
                      obj['entries'] = base

                  for k, v in list(obj.items()):
                      if isinstance(v, str):
                          for old, new in replacements.items():
                              v = v.replace(old, new)
                          obj[k] = v
                      else:
                          walk(v)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      if isinstance(v, str):
                          for old, new in replacements.items():
                              v = v.replace(old, new)
                          obj[i] = v
                      else:
                          walk(v)

          walk(data)

          path.write_text(json.dumps(data, ensure_ascii=False, indent='\t') + '\n', encoding='utf-8')
          PY

          python -m json.tool No_Cause_for_Alarm_5etools_CURRENT.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add No_Cause_for_Alarm_5etools_CURRENT.json
          git commit -m "Remove stale Session 3 state from v4.8"
          git push
