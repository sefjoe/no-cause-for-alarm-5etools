name: Bump NCFA Update Hash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-ncfa-update-hash.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add update hash and refresh modified timestamp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, shutil

          path = "No_Cause_for_Alarm_5etools_CURRENT.json"
          snap = "No_Cause_for_Alarm_5etools_v3.5.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          now = int(time.time())
          meta = data.setdefault("_meta", {})
          meta["dateLastModified"] = now
          meta["_dateLastModifiedHash"] = "7b4e05d3e7"
          for src in meta.get("sources", []):
              if src.get("json") == "NCFA":
                  src["dateLastModified"] = now

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent="\t")
              f.write("\n")

          shutil.copyfile(path, snap)
          PY

          python -m json.tool No_Cause_for_Alarm_5etools_CURRENT.json >/dev/null
          cmp No_Cause_for_Alarm_5etools_CURRENT.json No_Cause_for_Alarm_5etools_v3.5.json

      - name: Commit update hash bump and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bump-ncfa-update-hash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add No_Cause_for_Alarm_5etools_CURRENT.json No_Cause_for_Alarm_5etools_v3.5.json .github/workflows/bump-ncfa-update-hash.yml
          git commit -m "Bump NCFA homebrew update hash"
          git push origin HEAD:main
