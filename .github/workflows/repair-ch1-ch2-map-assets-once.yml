name: Repair Chapter 1-2 Map Assets Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ch1-ch2-map-assets-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified source images
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-27ac-822f-b0a9-367a40d0156f/raw?se=2026-09-19T02%3A58%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=dd5d2f82-f909-5049-aace-a1c7f895a729&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T19%3A02%3A26Z&ske=2026-09-19T19%3A02%3A26Z&sks=b&skv=2026-02-06&sig=qRiemM1Jsv6/3Js37c9SoL0CUknxtQdd8Znlt9puQYs%3D' -o /tmp/storm.png
          curl -L --fail --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-c424-822f-8b9b-258e5b88ca87/raw?se=2026-09-19T02%3A58%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=6a576b3f-2799-579c-b4aa-a5afafdc2df7&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T18%3A55%3A25Z&ske=2026-09-19T18%3A55%3A25Z&sks=b&skv=2026-02-06&sig=ERWrO3xnGiyEVfHf2m4G/2X/X/3c/o0gdRjySxKc2yE%3D' -o /tmp/ledger.png

      - name: Convert and validate map assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          jobs = [
              ('/tmp/storm.png', 'img/dm/storm_rescue.webp', (1154, 1363)),
              ('/tmp/ledger.png', 'img/dm/ledger_house.webp', (1448, 1086)),
          ]
          for src, dst, expected in jobs:
              im = Image.open(src)
              im.verify()
              im = Image.open(src).convert('RGB')
              if im.size != expected:
                  raise SystemExit(f'{src}: expected {expected}, got {im.size}')
              im.save(dst, 'WEBP', quality=90, method=6)
              b = Path(dst).read_bytes()
              if not b.startswith(b'RIFF') or b[8:12] != b'WEBP':
                  raise SystemExit(f'{dst}: invalid WebP')
          PY

      - name: Point adventure JSON at repaired assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          path = 'No_Cause_for_Alarm_5etools_CURRENT.json'
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)

          storm = 'https://raw.githubusercontent.com/sefjoe/no-cause-for-alarm-5etools/main/img/dm/storm_rescue.webp'
          ledger = 'https://raw.githubusercontent.com/sefjoe/no-cause-for-alarm-5etools/main/img/dm/ledger_house.webp'

          def walk(v):
              if isinstance(v, dict):
                  href = v.get('href')
                  title = v.get('title')
                  if isinstance(href, dict) and href.get('type') == 'external':
                      url = href.get('url', '')
                      if title == 'The Storm — Rescue Scene' or 'storm_rescue' in url:
                          href['url'] = storm
                          v['width'] = 1154
                          v['height'] = 1363
                      elif title == 'Ledger House' or 'ledger_house' in url:
                          href['url'] = ledger
                          v['width'] = 1448
                          v['height'] = 1086
                  for x in v.values():
                      walk(x)
              elif isinstance(v, list):
                  for x in v:
                      walk(x)
          walk(data)

          meta = data.setdefault('_meta', {})
          for src in meta.get('sources', []):
              if src.get('json') == 'NCFA':
                  src['version'] = '2.13'
          meta['dateLastModified'] = int(time.time())

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent='\t')
              f.write('\n')
          PY
          python -m json.tool No_Cause_for_Alarm_5etools_CURRENT.json >/dev/null

      - name: Commit repaired maps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/dm/storm_rescue.webp img/dm/ledger_house.webp No_Cause_for_Alarm_5etools_CURRENT.json
          git commit -m 'Repair Storm and Ledger House map files'
          git push
