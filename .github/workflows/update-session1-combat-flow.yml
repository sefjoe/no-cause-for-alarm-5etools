name: Apply Session 1 combat flow update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-session1-combat-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update NCFA Session 1 flow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('No_Cause_for_Alarm_5etools_CURRENT.json')
          text = p.read_text(encoding='utf-8')

          replacements = {
              '"version": "3.4"': '"version": "3.5"',
              '"dateLastModified": 1789841760': '"dateLastModified": 1789842600',
              'After the storm and Ledger House, Brakkus points out several ways capable people can find work. Council reclamation is the official route, but a private survey crew, residents, merchants, or simple exploration can all pull the party toward the Slums. Run {@b 2–3 meaningful encounters}, not a block-by-block extermination. {@b Suggested Session 1 encounters:} a mixed scavenger crew searching an abandoned shop, with one scavenger carrying a bundle of brass fittings and door hardware, one ruin predator in a collapsed residence, then a rescue involving a trapped Bellweather survey crew. The endangered worker is a one-scene NPC, not a future campaign hinge. Negotiation, retreat, and cooperation are valid outcomes whenever the opposition is not committed to violence.':
              'After the storm and Ledger House, Brakkus points out several ways capable people can find work. Council reclamation is the official route, but a private survey crew, residents, merchants, or simple exploration can all pull the party toward the Slums. Run {@b 2–3 meaningful encounters}, not a block-by-block extermination. {@b Suggested Session 1 sequence:} first, a mixed scavenger crew searching an abandoned shop, with one scavenger carrying a bundle of brass fittings and door hardware. Treat this primarily as a social and choice encounter; negotiation, intimidation, observation, retreat, or combat are all valid, and the scavengers should not attack simply because the party approaches. Second, route the party through a collapsed residence where a hungry {@creature Grick|XMM} provides the reliable combat beat for the session. This combat should occur before Session 1 ends even if the scavengers are resolved peacefully. If time remains, reveal the trail toward the missing survey crew and end on that clue. Save the giant-spider warehouse encounter and the survey-crew rescue for Session 2. Negotiation, retreat, and cooperation remain valid outcomes whenever the opposition is intelligent and not committed to violence.',
              'Four {@creature Bandit|XMM|Bandits} watch from a ruined storefront and demand a “street toll.” They prefer intimidation and retreat to a fight.':
              'Four scavengers pick through a ruined storefront and the rubble around it; use {@creature Bandit|XMM|Bandit} stat blocks if combat breaks out. One carries a club, one carries a bundle of brass fittings and door hardware, and two keep salvaged items partly hidden behind their backs. They are wary and defensive but do not attack first. They prefer talking, bluffing, bargaining, or backing away to a fight.',
              '4 {@creature Bandit|XMM|Bandits}. They flee when two fall or Mera is reduced below half hit points.':
              '4 scavengers (use {@creature Bandit|XMM|Bandit} stat blocks). They fight only if threatened, attacked, cornered, or convinced the party intends to rob or arrest them. If combat begins, they flee or surrender when two are incapacitated or when an escape route opens.',
              '"name": "C3 — Collapsed Warehouse"': '"name": "C3 — Collapsed Residence"',
              'The warehouse used for Scene 2. Webbing, rubble, and the giant spiders make this the main tactical obstacle on the shortest route through the neighborhood.':
              'The collapsed residence used for the Session 1 combat beat. Broken masonry, unstable flooring, and a hungry grick make this the first unavoidable predatory threat on the route deeper into the neighborhood.',
              '"name": "Scene 2: Collapsed Warehouse"': '"name": "Scene 2: Collapsed Residence"',
              '{@b Map areas:} {@area C3 — Collapsed Warehouse|3c3|x} and {@area D4 — Predator / Hazard Zone|3d4|x}. Run the giant-spider encounter at C3. D4 is the adjoining rubble and hazard zone on the route toward the dye works and can carry environmental pressure without adding another mandatory fight.':
              '{@b Map areas:} {@area C3 — Collapsed Residence|3c3|x} and {@area D4 — Predator / Hazard Zone|3d4|x}. Run the grick encounter at C3 as Session 1’s reliable combat beat. D4 is adjoining rubble on the route toward the dye works and foreshadows the deeper danger without adding another mandatory fight.',
              'The shortest route to the survey crew passes through a warehouse occupied by giant spiders.':
              'The route deeper into the district passes through a collapsed residence where a hungry grick has learned to ambush anything moving through the rubble.',
              'Webbing makes the floor difficult terrain. A character who studies the rafters spots movement without a roll; otherwise use DC 13 Wisdom (Perception).':
              'Broken masonry and fallen furniture create patches of difficult terrain. A character who studies the rubble spots signs of a lurking predator without a roll; otherwise use DC 13 Wisdom (Perception) to notice the grick before it attacks.',
              '2 {@creature Giant Spider|XMM|Giant Spiders}; use 1 if the party is still badly depleted from the storm.':
              '1 {@creature Grick|XMM}. It is hungry, territorial, and not interested in negotiation. If the party is badly depleted from the storm, it begins in a poor position rather than gaining surprise.',
              '{@b Map areas:} {@area D4 — Predator / Hazard Zone|3d4|x}, {@area E4 — Old Dye Works|3e4|x}, and {@area E5 — Missing Survey Crew Site|3e5|x}. The grick prowls the adjoining rubble at D4; the party approaches through E4 and finds Lessa Dorn and Kav Orin barricaded at E5.':
              '{@b Map areas:} {@area D4 — Predator / Hazard Zone|3d4|x}, {@area E4 — Old Dye Works|3e4|x}, and {@area E5 — Missing Survey Crew Site|3e5|x}. Beginning in Session 2, webbing and movement around D4 lead toward the dye works, where Lessa Dorn and Kav Orin are barricaded at E5.',
              'Two surveyors are barricaded inside while a grick prowls the adjoining rubble.':
              'Two surveyors are barricaded inside while giant spiders hunt through the adjoining rubble and damaged structures.',
              'The {@creature Grick|XMM} hides near the rear exit and attacks when prey passes within reach.':
              'The {@creature Giant Spider|XMM|Giant Spiders} use webbing and ruined walls to cut off the safest approach to the trapped surveyors.',
              '1 {@creature Grick|XMM}. It retreats into rubble below one-third hit points if an escape path exists.':
              '2 {@creature Giant Spider|XMM|Giant Spiders}; use 1 if the party enters Session 2 badly depleted or has not had a safe rest.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit campaign update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-session1-combat-flow.yml
          git add No_Cause_for_Alarm_5etools_CURRENT.json
          git commit -m 'Revise Session 1 social and combat flow'
          git push
