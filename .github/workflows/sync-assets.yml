name: Sync NCFA Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download campaign assets from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/player img/dm
