                          "Do not use ownership rules to erase treasure. When the party voluntarily returns valuable property, replace a meaningful portion of the lost cash value with reputation, favors, negotiated pay, access, or another concrete benefit."
                      ],
                  },
                  {
                      "type": "entries",
                      "name": "Story Rewards",
                      "entries": [
                          "When a chapter should feel rewarding without adding another permanent item, use benefits such as temporary free lodging and meals, a Council permit favor, merchant priority or discounts on scarce mundane gear, temple healing or restoration, reclamation-crew support, a safe house, expedition transport, a reliable guide, research access, a difficult faction introduction, or use of a workshop, office, storage area, garden, or dock."
                      ],
                  },
              ],
          }

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          now = int(time.time())
          meta = data.setdefault("_meta", {})
          for src in meta.get("sources", []):
              if src.get("json") == "NCFA":
                  if version_tuple(src.get("version", "0")) < version_tuple("2.7"):
                      src["version"] = "2.7"
                  src["dateLastModified"] = now
          meta["dateLastModified"] = now

          adventure = next((a for a in data.get("adventure", []) if a.get("id") == "NCFA-RuinsOfBellweather" and a.get("source") == "NCFA"), None)
          if adventure is None:
              raise RuntimeError("NCFA adventure metadata not found")

          contents = adventure.setdefault("contents", [])
          for item in contents:
              if item.get("name") in rewards:
                  headers = item.setdefault("headers", [])
                  if "Rewards" not in headers:
                      headers.append("Rewards")
          if not any(item.get("name") == "Appendix B: Rewards and Loot" for item in contents):
              insert_at = next((i for i, item in enumerate(contents) if item.get("name", "").startswith("Appendix C:")), len(contents))
              contents.insert(insert_at, {
                  "name": "Appendix B: Rewards and Loot",
                  "headers": [
                      "Reward Philosophy",
                      "Permanent Magic Pacing",
                      "Levels 3–4: Minor Cache (d12)",
                      "Levels 5–8: Reclamation Cache (d12)",
                      "Levels 9–12: Strategic Cache (d12)",
                      "Levels 13–16: Major Cache (d12)",
                      "Permanent Item Selection",
                      "Salvage and Ownership",
                      "Story Rewards"
                  ]
              })

          pack = next((p for p in data.get("adventureData", []) if p.get("id") == "NCFA-RuinsOfBellweather" and p.get("source") == "NCFA"), None)
          if pack is None:
              raise RuntimeError("NCFA adventure data not found")

          sections = pack.setdefault("data", [])
          by_name = {s.get("name"): s for s in sections if isinstance(s, dict)}

          for chapter_name, lines in rewards.items():
              chapter = by_name.get(chapter_name)
              if chapter is None:
                  raise RuntimeError(f"Missing chapter: {chapter_name}")
              entries = chapter.setdefault("entries", [])
              entries[:] = [e for e in entries if not (isinstance(e, dict) and e.get("name") == "Rewards")]
              entries.append(reward_block(lines))

          sections[:] = [s for s in sections if not (isinstance(s, dict) and s.get("name") == "Appendix B: Rewards and Loot")]
          insert_at = next((i for i, s in enumerate(sections) if isinstance(s, dict) and str(s.get("name", "")).startswith("Appendix C:")), len(sections))
          sections.insert(insert_at, appendix)

          campaign_guide = by_name.get("Campaign Guide")
          if campaign_guide is None:
              campaign_guide = find_named(sections, "Campaign Guide")
          treasure = find_named(campaign_guide, "Treasure") if campaign_guide else None
          if treasure is None:
              raise RuntimeError("Campaign Guide Treasure section not found")
          treasure["entries"] = [
              "Treasure favors memorable rewards over large piles of interchangeable magic items. Permanent magic should usually be tied to a recovered heirloom, named location, faction reward, or story consequence. Coin, art objects, consumables, salvage, and story rewards remain useful throughout the adventure.",
              "The campaign is balanced for four characters. By about 5th level, the party should have roughly four meaningful uncommon permanent items across the group; rare items begin appearing in the middle tiers, very rare items become major rewards in the high tiers, and legendary items remain story-specific.",
              "Use each chapter's Rewards section for its intended reward budget and Appendix B: Rewards and Loot for cache tables, catch-up guidance, attunement guardrails, and salvage ownership. Named story relics remain in place even when generic treasure quantities are superseded."
          ]

          serialized = json.dumps(data, ensure_ascii=False, indent="\t") + "\n"
          with open(path, "w", encoding="utf-8") as f:
              f.write(serialized)

          with open(path, "r", encoding="utf-8") as f:
              check = json.load(f)

          src = next(s for s in check["_meta"]["sources"] if s.get("json") == "NCFA")
          if version_tuple(src.get("version", "0")) < version_tuple("2.7"):
              raise RuntimeError("Version did not reach 2.7")
          text = json.dumps(check, ensure_ascii=False)
          if "adventure for four characters" not in text:
              raise RuntimeError("Four-character campaign baseline missing")
          if "Appendix B: Rewards and Loot" not in text:
              raise RuntimeError("Rewards appendix missing")
          for chapter_name in rewards:
              chapter = find_named(check.get("adventureData", []), chapter_name)
              if chapter is None or find_named(chapter, "Rewards") is None:
                  raise RuntimeError(f"Rewards validation failed: {chapter_name}")
          print("Validated NCFA four-PC rewards update")
          PY

