name: Sync NCFA Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download campaign assets from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/player img/dm
          download() {
            local id="$1"
            local out="$2"
            curl -L --fail --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "$out"
          }

          download "11afH5k23h5f9XQm5E49yB3z5D6ySXXCF" "img/cover.webp"

          download "1Lm4MKU_vKY83QJir8SkjwLVsSq6wp89j" "img/player/blackstone_temple.webp"
