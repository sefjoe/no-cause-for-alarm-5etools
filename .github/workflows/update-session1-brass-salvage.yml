name: Apply Session 1 brass salvage update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-session1-brass-salvage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update NCFA live JSON
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('No_Cause_for_Alarm_5etools_CURRENT.json')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'a mixed scavenger crew searching an abandoned shop, one ruin predator in a collapsed residence':
              'a mixed scavenger crew searching an abandoned shop, with one scavenger carrying a bundle of brass fittings and door hardware, one ruin predator in a collapsed residence',
              '1d4 {@creature Bandit|XMM|Bandits} stripping copper and timber; desperate rather than evil':
              '1d4 {@creature Bandit|XMM|Bandits} stripping brass fittings, door hardware, and timber from abandoned buildings; desperate rather than evil',
              '"version": "3.3"': '"version": "3.4"',
              '"dateLastModified": 1789840599': '"dateLastModified": 1789841760',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit campaign update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-session1-brass-salvage.yml
          git add No_Cause_for_Alarm_5etools_CURRENT.json
          git commit -m 'Update Session 1 scavenger salvage to brass hardware'
          git push
