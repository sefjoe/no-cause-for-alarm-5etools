<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1548 1175">
<title>Session 4 reusable street build on 36 × 24 inch mat</title>
<desc>One inch squares equal five feet. North storefront outlines, clear street, and two south buildings. W indicates six real wall pieces; D two real door walls; V one real window wall; B four barrels and J two jars. The rest is marker lines.</desc>
<rect width="1548" height="1175" fill="#14252c"/><text x="774" y="33" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f8e8cc">BELLWETHER — SINGLE REUSABLE STREET</text>
<text x="774" y="61" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#cfb78e">36 × 24 inch gridded mat • one square = 5 ft • 15 physical terrain pieces • no rebuild between scenes</text>
